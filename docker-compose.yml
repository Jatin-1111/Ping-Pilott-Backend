# The API alone is not the product: checks run in monitor-worker and alerts are sent by alert-worker.
# Without those two (and Redis) servers are never checked and nobody is ever alerted.
x-backend: &backend
  build: .
  restart: always
  env_file: .env
  environment:
    - REDIS_URL=redis://redis:6379
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  backend:
    <<: *backend
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  monitor-worker:
    <<: *backend
    command: ["node", "workers/monitorWorker.js"]

  alert-worker:
    <<: *backend
    command: ["node", "workers/alertWorker.js"]

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  redis-data:
