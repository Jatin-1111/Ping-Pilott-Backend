# The API alone is not the product: checks run in monitor-worker and alerts are sent by alert-worker.
# Without those two (and Redis) servers are never checked and nobody is ever alerted.
x-backend: &backend
  build: .
  restart: always
  env_file: .env
  environment:
    - REDIS_URL=redis://redis:6379
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  backend:
    <<: *backend
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - RUN_WORKERS=false # monitor-worker and alert-worker below do this
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # These two have no HTTP port, so their healthcheck looks for the heartbeat each worker writes to Redis every 15 s
  # (utils/workerHealth.js). Docker only marks an unhealthy container; point an outside monitor at
  # https://<api>/health/monitoring, or run something like willfarrell/autoheal, to be told or have it restarted.
  monitor-worker:
    <<: *backend
    command: ["node", "workers/monitorWorker.js"]
    healthcheck:
      test: ["CMD", "node", "scripts/workerHealthcheck.js", "monitor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  alert-worker:
    <<: *backend
    command: ["node", "workers/alertWorker.js"]
    healthcheck:
      test: ["CMD", "node", "scripts/workerHealthcheck.js", "alert"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  redis-data:
