server {
    listen 80;
    server_name api.pingpilott.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.pingpilott.com;

    ssl_certificate /etc/letsencrypt/live/api.pingpilott.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pingpilott.com/privkey.pem;

    location / {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # The API rate-limits by client address (trust proxy = 1), so it must see the real one
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
